spring:
  application:
    name: openatom-knowledge-os
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  cache:
    type: simple

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    dev-mode: ${APP_SECURITY_DEV_MODE:true}
  oidc:
    issuer: ${OIDC_ISSUER:https://oauth.jmi-openatom.cn/api/v1}
    introspection-uri: ${OIDC_INTROSPECTION_URI:https://oauth.jmi-openatom.cn/api/v1/oauth/introspect}
    user-info-uri: ${OIDC_USERINFO_URI:https://oauth.jmi-openatom.cn/api/v1/oauth/userinfo}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root: ${STORAGE_LOCAL_ROOT:./storage}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:openatom}
    secret-key: ${MINIO_SECRET_KEY:openatom123}
    bucket: ${MINIO_BUCKET:knowledge-files}
  search:
    endpoint: ${ELASTICSEARCH_ENDPOINT:}
    index: ${ELASTICSEARCH_INDEX:openatom-knowledge}
  ai:
    provider: ${AI_PROVIDER:deepseek}
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:sk-2fa5a62580104fadbb2e84e9251e21ba}
    model: ${AI_MODEL:deepseek-v4-flash}
