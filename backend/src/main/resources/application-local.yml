spring:
  datasource:
    url: jdbc:h2:file:./storage/knowledge-os;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    locations: classpath:db/migration

app:
  security:
    dev-mode: true
  storage:
    provider: local
  search:
    endpoint: ""

management:
  health:
    redis:
      enabled: false
