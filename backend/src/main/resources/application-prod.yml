spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:openatom_knowledge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:openatom}
    password: ${MYSQL_PASSWORD:openatom123}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

app:
  security:
    dev-mode: false
  storage:
    provider: minio
  search:
    endpoint: ${ELASTICSEARCH_ENDPOINT:http://elasticsearch:9200}
